name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test,docs]"
      - run: python -m pytest
      - run: python -m scripts.verify_docs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[ui-test]"
      - run: python -m playwright install --with-deps chromium
      - name: Verify the local browser lab
        run: |
          python -m crypto.lab &
          LAB_PID=$!
          trap 'kill "$LAB_PID"' EXIT
          python -m scripts.check_lab_ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-captures
          path: output/playwright/
