[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-from-scratch-educational"
version = "1.0.0"
description = "Educational cryptographic algorithms implemented from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=8", "cryptography>=43"]
docs = ["Pillow>=10", "matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["crypto*", "examples*", "experiments*"]
